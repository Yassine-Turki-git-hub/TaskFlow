<div class="bg-white rounded-xl shadow-md p-6 border border-gray-100 hover:shadow-lg transition-shadow duration-300 flex flex-col justify-between cursor-pointer">
    <div>
        <h1>Liste des projets:</h1>
        <!--barre de recherche de projet selon leur description ou nom ou l'id-->
        <div class="flex justify-between items-start gap-4 mb-3">
            <input type="text" placeholder="Rechercher un projet par id ou nom ou description" [(ngModel)]="searchTerm" (input)="onSearchChange()"/>
        </div>
        <!--Liste des proejct cards-->
        <div class="cards-grid">
            @for (proj of filteredProjects; track proj.id) {
                <app-project-card [project]="proj" (selectProject)="handleProjectSelection($event)"></app-project-card>
            } @empty {
                <p>Aucun projet.</p>
            }
        </div>
    </div>
</div>
