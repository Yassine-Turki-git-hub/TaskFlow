<div 
    class="bg-white rounded-xl shadow-md p-6 border transition-all duration-300 flex flex-col justify-between cursor-pointer"
    [ngClass]="{
        'border-blue-500 ring-2 ring-blue-200 shadow-lg': isSelected,
        'border-gray-100 hover:shadow-lg': !isSelected
    }"
    (click)="onSelectProject()"
>
    <div>
        <!-- En-tête : Titre et Statut -->
        <div class="flex justify-between items-start gap-4 mb-3">
            <h3 class="text-xl font-bold text-gray-800 tracking-tight">{{ project.id }}</h3>
            <h3 class="text-xl font-bold text-gray-800 tracking-tight">{{ project.name }}</h3>
          
          <span class="px-3 py-1 rounded-full text-xs font-semibold tracking-wide uppercase"
                [ngClass]="{
                  'bg-amber-100 text-amber-800': project.status === TypeStatus.EnCours,
                  'bg-emerald-100 text-emerald-800': project.status === TypeStatus.Termine,
                  'bg-sky-100 text-sky-800': project.status === TypeStatus.EnAttente
                }">
            {{ project.status }}
          </span>
        </div>
        <p class="text-gray-600 text-sm mb-4 leading-relaxed">{{ project.description }}</p>

        <!-- Section Tâches : affichée uniquement si le projet est sélectionné -->
        @if (isSelected) {
          <div class="mb-4 animate-fadeIn">
            <app-task-list [tasks]="project.tasks || []"></app-task-list>
          </div>
        } @else {
          <p class="text-xs text-gray-400 italic mb-4">Cliquez pour voir les tâches...</p>
        }
      </div>

      <!-- Bouton d'action -->
      <div class="flex justify-end pt-2">
        <button 
          class="text-white text-sm font-medium px-4 py-2 rounded-lg transition-colors duration-200 shadow-sm"
          [ngClass]="isSelected ? 'bg-gray-600 hover:bg-gray-700' : 'bg-blue-600 hover:bg-blue-700'"
          (click)="$event.stopPropagation(); onSelectProject()"
        >
          {{ isSelected ? 'Fermer' : 'Sélectionner' }}
        </button>
      </div>
    </div>
