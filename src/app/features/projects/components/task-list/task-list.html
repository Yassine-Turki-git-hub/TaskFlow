<div class="bg-white rounded-xl shadow-sm p-4 border border-gray-100">
    <h3 class="text-lg font-bold text-gray-800 mb-3">Liste des taches</h3>
    
    @if (tasks && tasks.length > 0) {
        <ul class="space-y-3">
            @for (task of tasks; track task.id) {
                <li class="flex items-center justify-between p-3 rounded-lg bg-gray-50 border-l-4 shadow-sm transition-all"
                    [ngClass]="getStatusClass(task.status)">
                    
                    <div class="flex items-center gap-3">
                        <span class="text-sm font-medium text-gray-800">
                            {{task.id}}: {{task.title}}
                        </span>
                        
                        <span class="text-[10px] font-bold px-2 py-0.5 rounded uppercase"
                              [ngClass]="getPriorityClass(task.priority)">
                            {{task.priority}}
                        </span>
                    </div>

                    <div class="text-xs font-medium text-gray-500">
                        {{task.status}}
                    </div>
                </li>
            }
        </ul>
    } @else {
        <p class="text-xs text-gray-400 italic m-0">Aucune tache disponible.</p>
    }
</div>
